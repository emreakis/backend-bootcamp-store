<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; } .mono { font-family: Consolas, Menlo, monospace; }</style>
  <defs>
    <marker id="st" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="60" y="46" font-size="18" font-weight="600" fill="#111827">Timeouts, retries, breakers - and the budget they add up to</text>
  <text x="60" y="68" font-size="12" fill="#6b7280">The deadline is per attempt. Three attempts and backoff spend 6.25 seconds of somebody's patience.</text>
  <text x="60" y="106" font-size="12" font-weight="600" fill="#9ca3af">1 DEADLINE + 2 BOUNDED RETRY - THE WORST CASE, TO SCALE</text>
  <rect x="130" y="128" width="220" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="240.0" y="150" font-size="11.5" fill="#1e3a8a" text-anchor="middle">attempt 1 - 2000 ms</text>
  <line x1="350" y1="124" x2="350" y2="166" stroke="#dc2626" stroke-width="2"/>
  <rect x="364" y="128" width="220" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="474.0" y="150" font-size="11.5" fill="#1e3a8a" text-anchor="middle">attempt 2 - 2000 ms</text>
  <line x1="584" y1="124" x2="584" y2="166" stroke="#dc2626" stroke-width="2"/>
  <rect x="598" y="128" width="220" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="708.0" y="150" font-size="11.5" fill="#1e3a8a" text-anchor="middle">attempt 3 - 2000 ms</text>
  <line x1="818" y1="124" x2="818" y2="166" stroke="#dc2626" stroke-width="2"/>
  <text x="357" y="121" font-size="10" fill="#dc2626">deadline exceeded</text>
  <text x="357" y="180" font-size="10" fill="#6b7280">backoff</text>
  <line x1="130" y1="196" x2="845" y2="196" stroke="#d1d5db" stroke-width="1"/>
  <line x1="130" y1="193" x2="130" y2="199" stroke="#9ca3af" stroke-width="1"/>
  <text x="130" y="214" font-size="10" fill="#9ca3af" text-anchor="middle">0 s</text>
  <line x1="240" y1="193" x2="240" y2="199" stroke="#9ca3af" stroke-width="1"/>
  <text x="240" y="214" font-size="10" fill="#9ca3af" text-anchor="middle">1 s</text>
  <line x1="350" y1="193" x2="350" y2="199" stroke="#9ca3af" stroke-width="1"/>
  <text x="350" y="214" font-size="10" fill="#9ca3af" text-anchor="middle">2 s</text>
  <line x1="460" y1="193" x2="460" y2="199" stroke="#9ca3af" stroke-width="1"/>
  <text x="460" y="214" font-size="10" fill="#9ca3af" text-anchor="middle">3 s</text>
  <line x1="570" y1="193" x2="570" y2="199" stroke="#9ca3af" stroke-width="1"/>
  <text x="570" y="214" font-size="10" fill="#9ca3af" text-anchor="middle">4 s</text>
  <line x1="680" y1="193" x2="680" y2="199" stroke="#9ca3af" stroke-width="1"/>
  <text x="680" y="214" font-size="10" fill="#9ca3af" text-anchor="middle">5 s</text>
  <line x1="790" y1="193" x2="790" y2="199" stroke="#9ca3af" stroke-width="1"/>
  <text x="790" y="214" font-size="10" fill="#9ca3af" text-anchor="middle">6 s</text>
  <line x1="130" y1="240" x2="818" y2="240" stroke="#dc2626" stroke-width="2"/>
  <line x1="130" y1="234" x2="130" y2="246" stroke="#dc2626" stroke-width="2"/>
  <line x1="818" y1="234" x2="818" y2="246" stroke="#dc2626" stroke-width="2"/>
  <text x="474.0" y="264" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">3 x 2000 ms + 250 ms backoff = 6.25 s spent on an error</text>
  <text x="474.0" y="282" font-size="11" fill="#6b7280" text-anchor="middle">whoever calls checkout has a budget of their own - six seconds may already be over it</text>
  <text x="60" y="314" font-size="11" fill="#374151">Retrying a charge is legal only because <tspan class="mono" fill="#1e3a8a">ChargeRequest</tspan> carries <tspan class="mono" fill="#1e3a8a">idempotency_key = 4</tspan> - a repeated key returns the original response, not a second bill.</text>
  <text x="60" y="356" font-size="12" font-weight="600" fill="#9ca3af">3 CIRCUIT BREAKER - WHEN THE BUDGET KEEPS BEING SPENT, STOP SPENDING IT</text>
  <rect x="140" y="386" width="180" height="48" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="230" y="406" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">CLOSED</text>
  <text x="230" y="423" font-size="10.5" fill="#166534" text-anchor="middle">calls flow, failures counted</text>
  <rect x="430" y="386" width="180" height="48" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="520" y="406" font-size="13" font-weight="600" fill="#991b1b" text-anchor="middle">OPEN</text>
  <text x="520" y="423" font-size="10.5" fill="#991b1b" text-anchor="middle">fail fast: 503 + Retry-After</text>
  <rect x="700" y="386" width="180" height="48" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="790" y="406" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">HALF-OPEN</text>
  <text x="790" y="423" font-size="10.5" fill="#92400e" text-anchor="middle">exactly one probe</text>
  <line x1="320" y1="410" x2="422" y2="410" stroke="#6b7280" stroke-width="1.5" marker-end="url(#st)"/>
  <text x="371" y="400" font-size="10.5" fill="#6b7280" text-anchor="middle">failures cross</text>
  <text x="371" y="428" font-size="10.5" fill="#6b7280" text-anchor="middle">the threshold</text>
  <line x1="610" y1="410" x2="692" y2="410" stroke="#6b7280" stroke-width="1.5" marker-end="url(#st)"/>
  <text x="651" y="400" font-size="10.5" fill="#6b7280" text-anchor="middle">BREAKER_</text>
  <text x="651" y="428" font-size="10.5" fill="#6b7280" text-anchor="middle">RESET_MS</text>
  <path d="M 790,386 V 364 H 520 V 380" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#st)"/>
  <text x="668" y="378" font-size="10.5" fill="#6b7280" text-anchor="middle">the probe fails - reopen, restart the clock</text>
  <path d="M 790,434 V 478 H 230 V 440" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#st)"/>
  <text x="510" y="494" font-size="10.5" fill="#6b7280" text-anchor="middle">the probe succeeds - close, and calls flow again</text>
  <text x="60" y="540" font-size="12" fill="#374151">A breaker that opens and never half-opens is a permanent outage you built yourself. The half-open probe is the whole trick.</text>
  <text x="60" y="560" font-size="11" fill="#6b7280">The four TODO(exercise 3.x) blocks in services/orders build exactly this ladder; SOLUTION.md carries these numbers.</text>
  <text x="60" y="608" font-size="11" fill="#9ca3af">Bootcamp - Session 3, slide 20</text>
</svg>