<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .march { animation: march 0.9s linear infinite; } @keyframes march { to { stroke-dashoffset: -10; } }.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }@keyframes pulse { 50% { transform: scale(1.5); opacity: 0.7; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <marker id="ax" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
    <marker id="path-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="60" y="52" font-size="18" font-weight="600" fill="#111827">Monolith or microservices - a decision grid, not a maturity ladder</text>
  <text x="60" y="74" font-size="12" fill="#6b7280">Pick by where you are. Every quadrant is somebody's correct answer.</text>
  <rect x="130" y="120" width="375" height="180" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.5"/>
  <text x="150" y="154" font-size="15" font-weight="600" fill="#111827">A few coarse services</text>
  <text x="150" y="178" font-size="12" fill="#374151">Simple domain, many teams: split by team</text>
  <text x="150" y="195" font-size="12" fill="#374151">ownership, not by entity.</text>
  <text x="150" y="212" font-size="12" fill="#374151">Three services, not thirty.</text>
  <rect x="515" y="120" width="375" height="180" rx="8" fill="#faf5ff" stroke="#ede9fe" stroke-width="1.5"/>
  <text x="535" y="154" font-size="15" font-weight="600" fill="#111827">Microservices</text>
  <text x="535" y="178" font-size="12" fill="#374151">Complex domain, many teams: split along</text>
  <text x="535" y="195" font-size="12" fill="#374151">bounded contexts so each team owns a</text>
  <text x="535" y="212" font-size="12" fill="#374151">service end to end.</text>
  <rect x="130" y="310" width="375" height="180" rx="8" fill="#f0fdf4" stroke="#dcfce7" stroke-width="1.5"/>
  <text x="150" y="344" font-size="15" font-weight="600" fill="#111827">Monolith</text>
  <text x="150" y="368" font-size="12" fill="#374151">Simple domain, small team: the default.</text>
  <text x="150" y="385" font-size="12" fill="#374151">Distribution here is pure overhead -</text>
  <text x="150" y="402" font-size="12" fill="#374151">ship the monolith and move on.</text>
  <rect x="515" y="310" width="375" height="180" rx="8" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.5"/>
  <text x="535" y="344" font-size="15" font-weight="600" fill="#111827">Modular monolith</text>
  <text x="535" y="368" font-size="12" fill="#374151">Complex domain, one team: keep one</text>
  <text x="535" y="385" font-size="12" fill="#374151">deployable but enforce module boundaries</text>
  <text x="535" y="402" font-size="12" fill="#374151">inside it - the seams to split along later.</text>
  <line x1="110" y1="500" x2="900" y2="500" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="110" y1="500" x2="110" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="700" y="524" font-size="12" fill="#6b7280">domain complexity</text>
  <text x="96" y="200" font-size="12" fill="#6b7280" transform="rotate(-90 96 200)" text-anchor="end">number of teams</text>
  <line x1="820" y1="360" x2="820" y2="250" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#path-purple)" class="march"/>
  <circle cx="820" cy="368" r="5" fill="#9333ea" class="pulse"/>
  <text x="838" y="330" font-size="12" font-weight="600" fill="#9333ea">the store</text>
  <text x="838" y="346" font-size="11" fill="#9333ea">Session 1 to 3</text>
  <text x="60" y="598" font-size="11" fill="#9ca3af">Bootcamp - Session 1, slide 18</text>
</svg>