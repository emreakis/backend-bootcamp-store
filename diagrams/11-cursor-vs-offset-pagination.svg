<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
  <style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; } .mono { font-family: Consolas, Menlo, monospace; }</style>
  <defs>
    <marker id="ins" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
  </defs>
  <rect width="960" height="680" fill="#ffffff"/>
  <text x="60" y="48" font-size="18" font-weight="600" fill="#111827">Cursors survive inserts; offsets drift</text>
  <text x="60" y="70" font-size="12" fill="#6b7280">Same catalogue, same insert between the two page reads. Only the meaning of "where was I" differs.</text>
  <rect x="60" y="96" width="420" height="470" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="82" y="128" font-size="15" font-weight="600" fill="#dc2626">OFFSET - a count of rows</text>
  <text x="82" y="158" font-size="10.5" class="mono" fill="#374151">GET /v1/products?limit=2&amp;offset=0</text>
  <rect x="82" y="172" width="118" height="22" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="92" y="187" font-size="11" class="mono" fill="#111827">BNS-005</text>
  <text x="208" y="187" font-size="10.5" fill="#93c5fd">page 1</text>
  <rect x="82" y="198" width="118" height="22" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="92" y="213" font-size="11" class="mono" fill="#111827">ESP-001</text>
  <text x="208" y="213" font-size="10.5" fill="#93c5fd">page 1</text>
  <rect x="82" y="224" width="118" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="92" y="239" font-size="11" class="mono" fill="#111827">GRD-002</text>
  <rect x="82" y="250" width="118" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="92" y="265" font-size="11" class="mono" fill="#111827">ROA-008</text>
  <line x1="82" y1="316" x2="112" y2="316" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ins)"/>
  <text x="120" y="320" font-size="11" fill="#ea580c">someone inserts CFE-010</text>
  <text x="82" y="352" font-size="10.5" class="mono" fill="#374151">GET /v1/products?limit=2&amp;offset=2</text>
  <rect x="82" y="366" width="118" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="92" y="381" font-size="11" class="mono" fill="#111827">BNS-005</text>
  <rect x="82" y="392" width="118" height="22" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
  <text x="92" y="407" font-size="11" class="mono" fill="#111827">CFE-010</text>
  <text x="208" y="407" font-size="10.5" fill="#ea580c">new</text>
  <rect x="82" y="418" width="118" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="92" y="433" font-size="11" class="mono" fill="#111827">ESP-001</text>
  <text x="208" y="433" font-size="10.5" fill="#ef4444">page 2 - again</text>
  <rect x="82" y="444" width="118" height="22" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="92" y="459" font-size="11" class="mono" fill="#111827">GRD-002</text>
  <text x="208" y="459" font-size="10.5" fill="#93c5fd">page 2</text>
  <rect x="82" y="470" width="118" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="92" y="485" font-size="11" class="mono" fill="#111827">ROA-008</text>
  <rect x="82" y="514" width="376" height="30" rx="6" fill="#fee2e2"/>
  <text x="94" y="533" font-size="11.5" font-weight="600" fill="#991b1b">ESP-001 served twice - and the client never finds out</text>
  <rect x="490" y="96" width="420" height="470" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="512" y="128" font-size="15" font-weight="600" fill="#16a34a">CURSOR - a position in the data</text>
  <text x="512" y="158" font-size="10.5" class="mono" fill="#374151">GET /v1/products?limit=2</text>
  <rect x="512" y="172" width="118" height="22" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="522" y="187" font-size="11" class="mono" fill="#111827">BNS-005</text>
  <text x="638" y="187" font-size="10.5" fill="#93c5fd">page 1</text>
  <rect x="512" y="198" width="118" height="22" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="522" y="213" font-size="11" class="mono" fill="#111827">ESP-001</text>
  <text x="638" y="213" font-size="10.5" fill="#93c5fd">page 1</text>
  <rect x="512" y="224" width="118" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="522" y="239" font-size="11" class="mono" fill="#111827">GRD-002</text>
  <rect x="512" y="250" width="118" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="522" y="265" font-size="11" class="mono" fill="#111827">ROA-008</text>
  <text x="512" y="296" font-size="10.5" class="mono" fill="#6b7280">next_cursor: ESP-001</text>
  <line x1="512" y1="316" x2="542" y2="316" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ins)"/>
  <text x="550" y="320" font-size="11" fill="#ea580c">someone inserts CFE-010</text>
  <text x="512" y="352" font-size="10.5" class="mono" fill="#374151">GET /v1/products?limit=2&amp;cursor=ESP-001</text>
  <rect x="512" y="366" width="118" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="522" y="381" font-size="11" class="mono" fill="#111827">BNS-005</text>
  <rect x="512" y="392" width="118" height="22" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
  <text x="522" y="407" font-size="11" class="mono" fill="#111827">CFE-010</text>
  <text x="638" y="407" font-size="10.5" fill="#ea580c">new</text>
  <rect x="512" y="418" width="118" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="522" y="433" font-size="11" class="mono" fill="#111827">ESP-001</text>
  <rect x="512" y="444" width="118" height="22" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="522" y="459" font-size="11" class="mono" fill="#111827">GRD-002</text>
  <text x="638" y="459" font-size="10.5" fill="#4ade80">page 2</text>
  <rect x="512" y="470" width="118" height="22" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="522" y="485" font-size="11" class="mono" fill="#111827">ROA-008</text>
  <text x="638" y="485" font-size="10.5" fill="#4ade80">page 2</text>
  <rect x="512" y="514" width="376" height="30" rx="6" fill="#dcfce7"/>
  <text x="524" y="533" font-size="11.5" font-weight="600" fill="#166534">resumes after ESP-001 - nothing re-served, nothing shifted</text>
  <text x="60" y="606" font-size="11" fill="#6b7280">The store paginates its one large collection this way: contracts/catalog.v1.yaml, GET /v1/products, ordered by sku.</text>
  <text x="60" y="624" font-size="11" fill="#9ca3af">CFE-010 sorted in behind the cursor, so this walk does not see it - the next walk does. What a cursor promises is never a row twice.</text>
  <text x="60" y="656" font-size="11" fill="#9ca3af">Bootcamp - Session 2, slide 12</text>
</svg>