# Configuration from the environment. Never from code.
#
# Two variables. That is the entire configuration surface of a service that reads.
# Compare with services/orders/java, which has seven — five of them about what to do
# when somebody else fails.

server.port=${PORT:8000}

store.implementation=java

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.main.banner-mode=off
logging.pattern.level=%5p
