# Configuration from the environment. Never from code.
#
# Note what is NOT here: no hostnames, no IP addresses, no ports for anything but our
# own. `catalog` and `payments` are service names the platform resolves — compose DNS
# today, Kubernetes services or a mesh tomorrow, with no code change.

server.port=${PORT:8080}

store.implementation=java

# The two addresses this service depends on, both injected.
store.catalog.url=${CATALOG_URL:http://localhost:8000}
store.payments.addr=${PAYMENTS_ADDR:localhost:50051}

# --- the four dials Session 3 is about ---------------------------------------
#
# Every one of these has a default of "forever" if you leave it out, and forever is
# the worst possible value. They are policy decisions, not guesses about how fast the
# dependency is: 2000 ms means "the longest a checkout may wait on a charge", decided
# by the people who own checkout.
store.catalog.timeout-ms=${CATALOG_TIMEOUT_MS:1000}
store.payments.timeout-ms=${PAYMENTS_TIMEOUT_MS:2000}
store.payments.retry-max=${PAYMENTS_RETRY_MAX:2}
store.breaker.failure-threshold=${BREAKER_FAILURE_THRESHOLD:5}
store.breaker.reset-ms=${BREAKER_RESET_MS:10000}

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.main.banner-mode=off

# Every log line carries the order id where there is one. In a monolith a stack trace
# told the whole story; here the story spans three processes, and the order id is the
# thread you pull to reassemble it.
logging.pattern.level=%5p
