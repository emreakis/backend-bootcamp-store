# Configuration comes from the environment. Never from code.
#
# Twelve-factor, and the reason it matters here: the artifact you run in Session 3 is
# identical in dev and prod. Only the environment around it changes. Every value
# below has a sensible default and an environment variable that overrides it.

server.port=${PORT:8080}

spring.datasource.url=jdbc:sqlite:${DATABASE_PATH:./store.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite takes one writer at a time. A single pooled connection keeps this teaching
# build free of "database is locked" noise that has nothing to teach.
spring.datasource.hikari.maximum-pool-size=1
# Foreign keys are off by default in SQLite. Turning them on per connection is what
# makes order_lines.sku -> products.sku a real constraint rather than a comment.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON

store.implementation=java
store.schema-path=${SCHEMA_PATH:../../db/schema.sql}
store.seed-path=${SEED_PATH:../../db/seed.sql}
# The payment stub is deterministic on purpose. A demo that fails randomly teaches
# nothing; a demo that fails on command teaches one thing at a time.
store.payment.decline-over-cents=${PAYMENT_DECLINE_OVER_CENTS:500000}
store.payment.always-decline=${PAYMENT_ALWAYS_DECLINE:false}

# The API speaks snake_case; Java speaks camelCase. One line reconciles them, so no
# record in this codebase needs a @JsonProperty annotation on every component.
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.main.banner-mode=off
logging.level.org.springframework.jdbc.datasource.init=WARN
